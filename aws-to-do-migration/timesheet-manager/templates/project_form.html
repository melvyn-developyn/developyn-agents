{% extends "base.html" %}
{% block content %}
<h1>New Project</h1>
<form class="card-form" method="post">
  <label>Name <input name="name" required></label>
  <label>Client <input name="client"></label>
  <label>Currency <input name="currency" value="GBP"></label>
  <label>Maximum hours <input type="number" step="0.25" name="maximum_hours"></label>
  <button>Create project</button>
</form>
{% endblock %}
