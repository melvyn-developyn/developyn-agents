{% extends "base.html" %}
{% block content %}
<section class="login-card">
  <h1>Track time without the faff.</h1>
  <p>Sign in with your Developyn Google account to manage project time.</p>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <div id="g_id_onload"
       data-client_id="{{ google_client_id }}"
       data-login_uri="{{ url_for('auth_google', _external=True) }}"
       data-auto_prompt="false"></div>
  <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_blue" data-text="continue_with"></div>
  <form id="next-form" method="post" action="{{ url_for('auth_google') }}">
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</section>
{% endblock %}
